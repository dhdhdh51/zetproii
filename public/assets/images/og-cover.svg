<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="BharatSEO — AI SEO and growth workspace for Indian businesses">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="12%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#06060c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Brand lockup -->
  <g transform="translate(84 86)">
    <rect width="60" height="60" rx="15" fill="url(#brand)"/>
    <path d="M13 40 L25 28 L32 35 L47 20" fill="none" stroke="#fff" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37 20 H47 V30" fill="none" stroke="#fff" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="41"
          font-family="Sora, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700"
          fill="#f4f5fb" letter-spacing="-1">Bharat<tspan fill="#a78bfa">SEO</tspan></text>
  </g>

  <!-- Headline -->
  <text x="84" y="290" font-family="Sora, 'Segoe UI', system-ui, sans-serif"
        font-size="70" font-weight="700" fill="#f4f5fb" letter-spacing="-2.5">Get found on Google.</text>
  <text x="84" y="372" font-family="Sora, 'Segoe UI', system-ui, sans-serif"
        font-size="70" font-weight="700" letter-spacing="-2.5" fill="url(#brand)">Turn traffic into customers.</text>

  <text x="84" y="436" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="27" fill="#9ba1b8">AI SEO content, an assistant trained on your business,</text>
  <text x="84" y="474" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="27" fill="#9ba1b8">a 24/7 website chatbot, and a CRM built for follow-up.</text>

  <!-- Capability chips -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="600">
    <g transform="translate(84 528)">
      <rect width="222" height="52" rx="26" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="30" y="33" fill="#e9eaf3">AI SEO content</text>
    </g>
    <g transform="translate(322 528)">
      <rect width="196" height="52" rx="26" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="30" y="33" fill="#e9eaf3">AI chatbot</text>
    </g>
    <g transform="translate(534 528)">
      <rect width="264" height="52" rx="26" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="30" y="33" fill="#e9eaf3">CRM + follow-ups</text>
    </g>
    <g transform="translate(814 528)">
      <rect width="228" height="52" rx="26" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="30" y="33" fill="#e9eaf3">Made in India</text>
    </g>
  </g>
</svg>
